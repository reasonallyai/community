name: Bug report
description: Report a reproducible problem with Reasonally.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Please search existing issues first. Reports are public; use redacted examples without API keys, passwords, or private account data."
  - type: dropdown
    id: area
    attributes:
      label: Where did the problem occur?
      options:
        - API
        - Chat
        - Dashboard
        - CLI
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the smallest example that reproduces the issue.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser, operating system, SDK or CLI version, and model ID when relevant.
  - type: textarea
    id: details
    attributes:
      label: Additional context
      description: Add redacted screenshots, error messages, or a request ID if useful.

